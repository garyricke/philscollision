# Netlify build + redirect config
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirect old Squarespace anchor URLs to the new routes
[[redirects]]
  from = "/blog/before-after"
  to = "/before-after/"
  status = 301

[[redirects]]
  from = "/article"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/cart"
  to = "/contact/"
  status = 301

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
